<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KidTube</title>
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KidTube">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="mock-banner" class="mock-banner" hidden>
    Modo demonstração — configura a chave API nas definições
  </div>

  <header class="topbar">
    <a href="#home" class="logo" aria-label="KidTube — início">
      <span class="logo-play" aria-hidden="true"></span>
      <span class="logo-text">KidTube</span>
    </a>
    <nav class="topnav" aria-label="Navegação principal">
      <a href="#subscriptions">Inscrições</a>
      <a href="#history">Histórico</a>
    </nav>
    <form id="search-form" class="search" role="search">
      <input id="search-input" type="search" placeholder="Pesquisar" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false"
             enterkeyhint="search" aria-label="Pesquisar vídeos">
      <button type="submit" class="search-btn" aria-label="Pesquisar">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path fill="currentColor" d="M20.87 20.17l-5.59-5.59A6.96 6.96 0 0 0 17 10c0-3.87-3.13-7-7-7s-7 3.13-7 7 3.13 7 7 7c1.71 0 3.28-.62 4.5-1.64l5.66 5.66.71-.85zM10 16c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/>
        </svg>
      </button>
    </form>
  </header>

  <main id="app" class="content" aria-live="polite"></main>

  <script src="app.js"></script>
</body>
</html>
