name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Montar site estático
        env:
          KIDTUBE_BUILD_ID: ${{ github.sha }}
        run: node scripts/build-static.mjs
      - name: Injetar chave da YouTube API (secret)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::warning::Secret YOUTUBE_API_KEY vazio — o site sai em modo demonstração."
          fi
          sed -i "s/__KIDTUBE_API_KEY__/$YOUTUBE_API_KEY/" docs/static-api.js
          grep -q '__KIDTUBE_API_KEY__' docs/static-api.js && { echo "placeholder não substituído"; exit 1; } || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
